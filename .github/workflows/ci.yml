# CI: lint, build, unit tests, e2e (Cypress against this commit's own production build).
# Required to pass before merging to main. On push to main, deploys to Coolify after all checks pass,
# then strict live checks (fail if the site is down) and a non-blocking content smoke test.
# Terraform (terraform/) is kept for optional GCP rollback only, not run in CI.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  cypress:
    runs-on: ubuntu-latest
    needs: lint-build-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start the production build (same layout as the Dockerfile)
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cd .next/standalone
          PORT=3000 HOSTNAME=127.0.0.1 nohup node server.js > "$GITHUB_WORKSPACE/server.log" 2>&1 &

      - name: Install Cypress binary
        run: npx cypress install

      - name: Run Cypress against this build
        uses: cypress-io/github-action@v6
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:3000
        with:
          install: false
          wait-on: "http://127.0.0.1:3000/api/health/live"
          wait-on-timeout: 120
          browser: chrome

      - name: Server log (on failure)
        if: failure()
        run: tail -n 100 server.log || true

  deploy:
    runs-on: ubuntu-latest
    needs: cypress
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ] || [ -z "$COOLIFY_URL" ]; then
            echo "::error::Coolify deploy blocked — set COOLIFY_URL, COOLIFY_API_TOKEN, and COOLIFY_APP_UUID in repo secrets."
            exit 1
          fi

          echo "Pinning Coolify app to commit ${GIT_SHA}"
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"git_commit_sha\":\"${GIT_SHA}\",\"health_check_host\":\"127.0.0.1\",\"health_check_path\":\"/api/health/live\",\"health_check_start_period\":45,\"health_check_interval\":30}" \
            "${COOLIFY_URL%/}/api/v1/applications/${COOLIFY_APP_UUID}"

          echo "Triggering Coolify deploy (lgportfolio app only — never inferencia/ollama)"
          # COOLIFY_APP_UUID must be the lgportfolio application in Coolify UI, not inferencia.
          deploy_response="$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Accept: application/json" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false")"
          echo "${deploy_response}"

  # After the deploy: the live site MUST answer (strict, fails the workflow and emails the owner), then a content
  # smoke test runs that only warns.
  smoke-production:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Wait for production (strict; Coolify builds the image, up to 8 minutes)
        run: |
          for i in $(seq 1 48); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 15 https://gimenez.dev/api/health/live || true)"
            if [ "$code" = "200" ]; then
              echo "gimenez.dev answered 200 after about $((i * 10)) s"
              # The old container can answer while the new one is still starting; give the swap a moment.
              sleep 30
              exit 0
            fi
            echo "attempt $i: HTTP ${code:-none}"
            sleep 10
          done
          echo "::error title=Production is not answering::Coolify accepted the deploy but https://gimenez.dev/api/health/live did not return HTTP 200 within 8 minutes. The live site is down or unreachable."
          exit 1

      - name: Strict live checks (plain curl)
        run: |
          set -euo pipefail
          fail() { echo "::error title=Production check failed::$1"; exit 1; }
          for path in / /privacy; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 20 "https://gimenez.dev${path}" || true)"
            [ "$code" = "200" ] || fail "https://gimenez.dev${path} returned HTTP ${code:-none}, expected 200."
          done
          body="$(curl -fsS -m 15 https://gimenez.dev/api/health/live)" || fail "/api/health/live request failed."
          [ "$body" = '{"status":"ok"}' ] || fail "/api/health/live body was not {\"status\":\"ok\"}."
          storage="$(curl -fsS -m 15 https://gimenez.dev/api/chat/storage)" || fail "/api/chat/storage request failed."
          echo "$storage" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d.get("storage"), bool)' || fail "/api/chat/storage did not return the expected JSON."
          echo "Live checks passed."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Smoke test production (content, non-blocking)
        id: smoke
        continue-on-error: true
        uses: cypress-io/github-action@v6
        env:
          CYPRESS_BASE_URL: https://gimenez.dev
        with:
          spec: cypress/e2e/smoke.cy.ts
          browser: chrome

      - name: Warn if the content smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: echo "::warning title=Production content smoke test failed::The site answers, but cypress/e2e/smoke.cy.ts failed against https://gimenez.dev. Check the pages; this step does not fail the workflow."
