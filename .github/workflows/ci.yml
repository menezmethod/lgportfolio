# CI: lint, build, unit tests, e2e (Cypress against this commit's own production build).
# Required to pass before merging to main. On push to main, deploys to Coolify after all checks pass,
# then a non-blocking smoke test runs against the live site.
# Terraform (terraform/) is kept for optional GCP rollback only, not run in CI.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  cypress:
    runs-on: ubuntu-latest
    needs: lint-build-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start the production build (same layout as the Dockerfile)
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cd .next/standalone
          PORT=3000 HOSTNAME=127.0.0.1 nohup node server.js > "$GITHUB_WORKSPACE/server.log" 2>&1 &

      - name: Install Cypress binary
        run: npx cypress install

      - name: Run Cypress against this build
        uses: cypress-io/github-action@v6
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:3000
        with:
          install: false
          wait-on: "http://127.0.0.1:3000/api/health/live"
          wait-on-timeout: 120
          browser: chrome

      - name: Server log (on failure)
        if: failure()
        run: tail -n 100 server.log || true

  deploy:
    runs-on: ubuntu-latest
    needs: cypress
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ] || [ -z "$COOLIFY_URL" ]; then
            echo "::error::Coolify deploy blocked — set COOLIFY_URL, COOLIFY_API_TOKEN, and COOLIFY_APP_UUID in repo secrets."
            exit 1
          fi

          echo "Pinning Coolify app to commit ${GIT_SHA}"
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"git_commit_sha\":\"${GIT_SHA}\",\"health_check_host\":\"127.0.0.1\",\"health_check_path\":\"/api/health/live\",\"health_check_start_period\":45,\"health_check_interval\":30}" \
            "${COOLIFY_URL%/}/api/v1/applications/${COOLIFY_APP_UUID}"

          echo "Triggering Coolify deploy (lgportfolio app only — never inferencia/ollama)"
          # COOLIFY_APP_UUID must be the lgportfolio application in Coolify UI, not inferencia.
          deploy_response="$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Accept: application/json" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false")"
          echo "${deploy_response}"

  # Non-blocking: after the deploy, check the live site. A failure here is a warning, never a red workflow.
  smoke-production:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for production (Coolify builds the image, up to about 5 minutes)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null https://gimenez.dev/api/health/live; then
              echo "gimenez.dev is up after $((i * 10)) s"
              # The old container can answer while the new one is still starting; give the swap a moment.
              sleep 30
              exit 0
            fi
            sleep 10
          done
          echo "::warning::gimenez.dev did not answer /api/health/live within 5 minutes; the smoke test will run anyway."

      - name: Smoke test production
        id: smoke
        continue-on-error: true
        uses: cypress-io/github-action@v6
        env:
          CYPRESS_BASE_URL: https://gimenez.dev
        with:
          spec: cypress/e2e/smoke.cy.ts
          browser: chrome

      - name: Warn if the production smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: echo "::warning title=Production smoke test failed::The deploy went out but cypress/e2e/smoke.cy.ts failed against https://gimenez.dev. Check the site; this does not fail the workflow."
